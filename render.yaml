services:
  - type: web
    name: linkpulse-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run migrate:up
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
